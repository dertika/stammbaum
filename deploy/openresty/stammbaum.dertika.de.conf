# OpenResty: Stammbaum-Dashboard unter https://stammbaum.dertika.de
# Gramps Web selbst läuft getrennt unter stammbaum-admin.dertika.de.
#
# Voraussetzung: CrowdSec-OpenResty-Bouncer ist im http-Kontext initialisiert
# (lua_package_path, lua_shared_dict crowdsec_cache, init_by_lua_block mit cs.init(...)),
# wie es die Datei crowdsec_openresty.conf des offiziellen Bouncers einrichtet.

# Ratenbegrenzung gegen das Durchprobieren von Link-Tokens und Logins
limit_req_zone $binary_remote_addr zone=stammbaum_share:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=stammbaum_auth:10m  rate=30r/m;

upstream stammbaum_app {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name stammbaum.dertika.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stammbaum.dertika.de;

    # Wildcard-Zertifikat *.dertika.de – Pfade anpassen
    ssl_certificate     /etc/openresty/ssl/dertika.de/fullchain.pem;
    ssl_certificate_key /etc/openresty/ssl/dertika.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # CrowdSec: gesperrte IPs gar nicht erst durchlassen
    access_by_lua_block {
        local cs = require "crowdsec"
        cs.Allow(ngx.var.remote_addr)
    }

    client_max_body_size 1m;

    # X-Content-Type-Options, Referrer-Policy und X-Robots-Tag setzt das Backend selbst
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # family-chart setzt Positionen per style-Attribut – daher 'unsafe-inline' nur für Styles
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # Einstieg über geheime Links
    location /s/ {
        limit_req zone=stammbaum_share burst=5 nodelay;
        limit_req_status 429;
        access_log off;   # Token nicht im Log speichern
        # Hinweis: abgewiesene Anfragen (429) landen mitsamt Pfad im error_log
        proxy_pass http://stammbaum_app;
    }

    # OIDC-Anmeldung (Authelia) für /admin
    location /auth/ {
        limit_req zone=stammbaum_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://stammbaum_app;
    }

    # Statische Dateien mit Hash im Namen dürfen lange gecacht werden
    location /assets/ {
        proxy_pass http://stammbaum_app;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    location / {
        proxy_pass http://stammbaum_app;
    }
}
